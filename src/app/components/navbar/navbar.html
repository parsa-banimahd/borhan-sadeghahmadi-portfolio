<mat-toolbar class="google-navbar" dir="ltr">
  <div class="nav-left">
    <button mat-icon-button (click)="toggleDrawer()" *ngIf="isHandset$ | async">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="brand-title" routerLink="/">Borhan Sadeghahmadi</span>

    <div class="desktop-menu" *ngIf="!(isHandset$ | async)">
      <a mat-button *ngFor="let item of navItems"
         [routerLink]="item.route"
         routerLinkActive="active-button"
         [routerLinkActiveOptions]="{ exact: true }">
        {{ item.label }}
      </a>
    </div>
  </div>

  <span class="spacer"></span>

  <div class="nav-right">
    <button mat-icon-button (click)="toggleTheme()" class="theme-toggle-btn">
      <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </div>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container" [class.drawer-opened]="drawer && drawer.opened" dir="ltr">
  <mat-sidenav #drawer class="sidenav" mode="over" position="start">
    <mat-nav-list>
      <a mat-list-item *ngFor="let item of navItems"
         [routerLink]="item.route"
         [routerLinkActiveOptions]="{ exact: true }"
         routerLinkActive="active-link"
         (click)="closeDrawer()">
        {{ item.label }}
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content class="hidden-content"></mat-sidenav-content>
</mat-sidenav-container>
